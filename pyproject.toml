[project]
name = "Hyena-enterprise-rag"
version = "0.1.0"
description = "Enterprise Multimodal RAG System enabling high-fidelity natural language search (Hệ thống RAG Đa phương thức xử lý báo cáo tài chính bằng AI)."
authors = [
    { name = "Yen Nguyen", email = "hyennguyen140205@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llama-index-core==0.11.0",
    "llama-index-embeddings-openai>=0.2.0",
    "llama-index-llms-openai>=0.2.0",
    "llama-parse==0.5.0",
    "llmsherpa>=0.1.4",
    "python-dotenv>=1.2.1",
    "openai>=1.0.0",
    "sentence-transformers>=5.2.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
